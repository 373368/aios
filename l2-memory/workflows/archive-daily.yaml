# 声明式工作流 schema（对齐微软 Agent Framework Declarative Workflows 1.0 范式）
# 私有 AI-OS 三层：workflow.yaml（编排声明）→ 原语执行 → LLM 判断点经 modelz
# 链路：export/ 会话文件（浏览器导出在前置完成） 扫描→提炼→入库(四分支)→索引→行为记录
# 用法：python workflows\wfengine.py workflows\archive-daily.yaml source=doubao

kind: Workflow
metadata:
  name: archive-daily
  description: 聊天数据 扫描→提炼→入库→索引 全链路
  version: 1.2

trigger:
  kind: OnCommand
  command: archive

variables:
  source: =System.Args.source

actions:
  # 1) 整理：扫描候选（去重游标=知识库 frontmatter conversation_id；source 支持英文别名，scan_new 映射平台目录）
  - kind: InvokePrimitive
    id: scan_new
    primitive: scan_new
    args:
      json: true
      platform: =Local.source
    output: =Local.ScanReport

  # 提取当前 source 的候选列表
  - kind: SetVariable
    id: extract_candidates
    var: Candidates
    value: =Local.ScanReport.{source}.candidates

  # 2) 提炼 + 四分支入库
  - kind: Loop
    id: process_candidates
    over: =Local.Candidates
    actions:
      # LLM 判断点：重复性/有效性/类别 → 四分支
      - kind: InvokeLLM
        id: judge_item
        model: =System.JudgeModel
        prompt_template: archive_judge
        input: =Loop.Item
        json_output: true
        output: =Local.Verdict

      # 分支处理（对应微软 ConditionGroup）
      - kind: ConditionGroup
        id: route_by_verdict
        conditions:
          - when: =Local.Verdict.branch == "new"
            actions:
              - kind: InvokePrimitive
                id: write_page
                via: primitives
                primitive: write_kb_page
                args:
                  title: =Local.Verdict.title
                  skeleton: =Local.Verdict.skeleton
                  subdir: =Local.Verdict.subdir
                  body: =Local.Verdict.body
          - when: =Local.Verdict.branch == "extend"
            actions:
              - kind: InvokePrimitive
                id: append_existing
                via: primitives
                primitive: append_kb_page
                args:
                  title: =Local.Verdict.title
                  skeleton: =Local.Verdict.skeleton
                  subdir: =Local.Verdict.subdir
                  addition: =Local.Verdict.body
          - when: =Local.Verdict.branch == "merge"
            actions:
              - kind: InvokePrimitive
                id: merge_pages
                via: primitives
                primitive: merge_kb_pages
                args:
                  target_title: =Local.Verdict.title
                  skeleton: =Local.Verdict.skeleton
                  subdir: =Local.Verdict.subdir
                  source_paths: =Local.Verdict.source_paths
          - when: =Local.Verdict.branch == "falsify"
            actions:
              - kind: InvokePrimitive
                id: mark_superseded
                via: primitives
                primitive: supersede_page
                args:
                  title: =Local.Verdict.title
                  skeleton: =Local.Verdict.skeleton
                  subdir: =Local.Verdict.subdir
                  superseded_by: =Local.Verdict.superseded_by

  # 3) 重建索引
  - kind: InvokePrimitive
    id: build_index
    primitive: build_index

  # 4) 行为记录
  - kind: InvokePrimitive
    id: log_behavior
    via: primitives
    primitive: append_behavior_log
    args:
      category: 归档
      line: archive_daily 完成