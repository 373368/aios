# 声明式工作流 schema（对齐微软 Agent Framework Declarative Workflows 1.0 范式）
# 私有 AI-OS 三层：workflow.yaml（编排声明）→ 原语执行 → LLM 判断点经 modelz
# 链路：学术来源 下载→提炼→入库(学术前沿)→索引
# 用法：python workflows\wfengine.py workflows\track-daily.yaml source=arxiv query="cat:cs.AI"

kind: Workflow
metadata:
  name: track-daily
  description: 学术前沿追踪 下载→提炼→入库→索引 全链路
  version: 1.0

trigger:
  kind: OnCommand
  command: track

variables:
  source: =System.Args.source
  query: =System.Args.query

actions:
  # 1) 下载（零 LLM 原语）
  - kind: InvokePrimitive
    id: fetch_items
    primitive: fetch_{source}
    args:
      query: =Local.query
    output: =Local.FetchData

  # 提取条目列表
  - kind: SetVariable
    id: extract_items
    var: Items
    value: =Local.FetchData.{source}.items

  # 2) 提炼 + 入库
  - kind: Loop
    id: process_items
    over: =Local.Items
    actions:
      # LLM 判断点：价值判断 + 提炼
      - kind: InvokeLLM
        id: judge_item
        model: =System.JudgeModel
        prompt_template: track_judge
        input: =Loop.Item
        json_output: true
        output: =Local.Verdict

      # keep → 写学术前沿页；skip → 忽略
      - kind: ConditionGroup
        id: route_by_verdict
        conditions:
          - when: =Local.Verdict.branch != "skip"
            actions:
              - kind: InvokePrimitive
                id: write_page
                via: primitives
                primitive: write_kb_page
                args:
                  title: =Local.Verdict.title
                  skeleton: =Local.Verdict.skeleton
                  subdir: =Local.Verdict.subdir
                  body: =Local.Verdict.body

  # 3) 重建索引
  - kind: InvokePrimitive
    id: build_index
    primitive: build_index