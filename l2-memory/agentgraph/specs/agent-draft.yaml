kind: AgentGraph
metadata:
  name: agent-draft
  description: 身份草拟师——brief → 身份声明草案（供新建身份表单 AI 填充；只读不落盘）
inputs:
  - {name: brief, type: longtext, required: true, hint: 一句话描述想要的 agent（职责/场景）}
  - {name: tools_catalog, type: text, hint: 可用工具池（由调用方注入）}
  - {name: models_catalog, type: text, hint: 可用模型清单（由调用方注入）}
model: opencode-go/deepseek-v4.1-flash
outputs: [suggestion]
state:
  brief: {type: str}
  tools_catalog: {type: str}
  models_catalog: {type: str}
  suggestion: {type: dict}
nodes:
  - id: draft
    declaration: ../declarations/agent-draftsman.md
    prompt: |
      需求：「{brief}」

      工具池（tools 只能从中选）：
      {tools_catalog}

      可用模型（model 只能从中选，或留空=运行时默认）：
      {models_catalog}

      产出身份声明草案，仅输出严格 JSON：
      {"name": "kebab-case 职责名", "description": "一句话职责", "model": "provider/model 或 空串", "tools": ["从工具池选，可为空数组"], "body": "markdown 正文：## 身份 / ## 运行规范 / ## 输出要求"}

      规则：
      - name 全小写、2-4 个短横线单词；取自职责，不用人名
      - body 直接可用：身份一句话 + 3-5 条运行规范 + 输出要求；不要留占位符
      - 需求里没有的能力不要编；工具拿不准少选（宁缺勿滥）
    json: true
    output: suggestion
edges:
  - [START, draft]
  - [draft, END]
