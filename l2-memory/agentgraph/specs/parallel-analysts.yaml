kind: AgentGraph
metadata:
  name: parallel-analysts
  description: 三个并行分析师（技术/风险/应用）+ 汇总节点；声明式 fan-out/fan-in 最小示例
model: volcengine-agent-plan/deepseek-v4-flash
trace: true
outputs: [findings, report]
state:
  topic: {type: str}
  findings: {type: list, reducer: add}
  report: {type: str}
nodes:
  - id: tech
    prompt: |
      你是技术分析师。针对主题「{topic}」给出 3 条技术视角要点，每条一行，直接输出，不要客套。
    output: findings
  - id: risk
    prompt: |
      你是风险分析师。针对主题「{topic}」给出 3 条风险与局限要点，每条一行，直接输出。
    output: findings
  - id: application
    prompt: |
      你是应用分析师。针对主题「{topic}」给出 3 条应用场景要点，每条一行，直接输出。
    output: findings
  - id: synthesis
    system: 你是一名严谨的研究汇总者。
    prompt: |
      把以下要点汇总为一段 150 字以内的结论（中文），不要分点：
      {findings}
    output: report
edges:
  - [START, tech]
  - [START, risk]
  - [START, application]
  - [tech, synthesis]
  - [risk, synthesis]
  - [application, synthesis]
  - [synthesis, END]
