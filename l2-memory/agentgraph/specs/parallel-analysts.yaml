kind: AgentGraph
metadata:
  name: parallel-analysts
  description: 三名声明身份（技术/风险/应用）+ 主编汇总；同底座、不同声明，fan-out/fan-in 协作示例
model: volcengine-agent-plan/deepseek-v4-flash
trace: true
outputs: [findings, report]
state:
  topic: {type: str}
  findings: {type: list, reducer: add}
  report: {type: str}
nodes:
  - id: tech
    declaration: ../declarations/tech-analyst.md
    prompt: 针对主题「{topic}」，按技术分析师的身份与规范完成分析。
    output: findings
  - id: risk
    declaration: ../declarations/risk-analyst.md
    prompt: 针对主题「{topic}」，按风险分析师的身份与规范完成分析。
    output: findings
  - id: application
    declaration: ../declarations/use-analyst.md
    prompt: 针对主题「{topic}」，按应用分析师的身份与规范完成分析。
    output: findings
  - id: synthesis
    declaration: ../declarations/editor.md
    prompt: |
      以下是各位分析师的要点汇总：
      {findings}
      请按汇总主编的身份与规范完成汇总。
    output: report
edges:
  - [START, tech]
  - [START, risk]
  - [START, application]
  - [tech, synthesis]
  - [risk, synthesis]
  - [application, synthesis]
  - [synthesis, END]
